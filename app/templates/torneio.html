<!-- app/templates/torneio.html -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modo Torneio — Vôlei</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>%F0%9F%8F%90</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <div class="inner">
    <div>
      <h1>🏆 Torneio</h1>
      <div id="tournamentName" class="muted">Nenhum torneio ativo</div>
    </div>
  </div>
</header>
<div class="app">
  <main>
    <section id="newTournament" class="panel">
      <h2>Novo torneio</h2>
      <form id="tournamentForm" class="inline">
        <input id="tournamentNameInput" placeholder="Nome do torneio" required>
        <input id="tournamentStart" type="date" required>
        <input id="tournamentEnd" type="date" required>
        <button class="primary">Criar</button>
      </form>
    </section>

    <section id="tournamentPanel" class="panel hidden">
      <h2>Times</h2>
      <form id="teamForm" class="inline">
        <input id="teamCode" placeholder="Código do time (ex.: A)" required>
        <button class="primary">+ Time</button>
      </form>
      <div id="teams"></div>
    </section>

    <section id="matchesSection" class="panel hidden">
      <h2>Jogos</h2>
      <form id="matchForm" class="inline">
        <select id="matchTeamA" required></select>
        <span>×</span>
        <select id="matchTeamB" required></select>
        <input id="matchScheduledAt" type="datetime-local" required>
        <input id="matchCourt" placeholder="Quadra (opcional)">
        <select id="matchStage">
          <option value="grupos">Fase de grupos</option>
          <option value="semifinal_1">Semifinal 1</option>
          <option value="semifinal_2">Semifinal 2</option>
          <option value="terceiro_lugar">3º lugar</option>
          <option value="final">Final</option>
        </select>
        <button class="primary">+ Jogo</button>
      </form>
      <div id="matches"></div>
    </section>

    <section id="standingsSection" class="panel hidden">
      <h2>Classificação</h2>
      <div id="standingsBody" class="player-grid"></div>
      <form id="generateSemisForm" class="inline hidden">
        <label class="muted">Semifinal 1 <input id="semi1At" type="datetime-local" required></label>
        <label class="muted">Semifinal 2 <input id="semi2At" type="datetime-local" required></label>
        <input id="semisCourt" placeholder="Quadra (opcional)">
        <button class="primary">Gerar semifinais</button>
      </form>
      <form id="generateFinalsForm" class="inline hidden">
        <label class="muted">3º lugar <input id="thirdAt" type="datetime-local" required></label>
        <label class="muted">Final <input id="finalAt" type="datetime-local" required></label>
        <input id="finalsCourt" placeholder="Quadra (opcional)">
        <button class="primary">Gerar 3º lugar e final</button>
      </form>
    </section>

    <section id="podiumSection" class="panel hidden">
      <h2>Pódio</h2>
      <div id="podiumBody"></div>
    </section>
  </main>
</div>
<div id="toast"></div>
<script src="/static/torneio.js"></script>
</body>
</html>
