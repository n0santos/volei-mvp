<!-- app/templates/torneio.html -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modo Torneio — Vôlei</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>%F0%9F%8F%90</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="torneio">
<header class="site-header">
  <div class="inner">
    <div>
      <h1>🏆 Torneio</h1>
      <div id="tournamentName" class="muted">Nenhum torneio ativo</div>
    </div>
  </div>
</header>
<div class="app">
  <main>
    <nav id="tabs" class="tabs hidden" role="tablist" aria-label="Seções do torneio">
      <button role="tab" data-tab="jogos">Jogos</button>
      <button role="tab" data-tab="classificacao">Classificação</button>
      <button role="tab" data-tab="equipes">Equipes</button>
    </nav>

    <section id="newTournament" class="panel">
      <h2>Novo torneio</h2>
      <form id="tournamentForm" class="inline">
        <input id="tournamentNameInput" placeholder="Nome do torneio" required>
        <input id="tournamentStart" type="date" required>
        <input id="tournamentEnd" type="date" required>
        <button class="primary">Criar</button>
      </form>
    </section>

    <div id="tournamentPanel" class="tab-pane hidden" data-pane="equipes">
      <section class="panel">
        <div class="stage-head">
          <div>
            <h2>Equipes</h2>
            <div id="teamsSummary" class="muted"></div>
          </div>
          <button type="button" id="addTeamToggle" class="primary" aria-expanded="false" aria-controls="teamForm">+ Equipe</button>
        </div>
        <form id="teamForm" class="match-form hidden">
          <label>Nome da equipe <input id="teamCode" placeholder="Ex.: JASVEM" required></label>
          <button class="primary">Adicionar equipe</button>
        </form>
      </section>
      <div id="teams"></div>
    </div>

    <div id="matchesSection" class="tab-pane hidden" data-pane="jogos">
      <section class="panel">
        <div class="stage-head">
          <div>
            <h2>Fase de grupos</h2>
            <div id="groupProgress" class="muted"></div>
          </div>
          <button type="button" id="addMatchToggle" class="primary" aria-expanded="false" aria-controls="matchForm">+ Jogo</button>
        </div>
        <form id="matchForm" class="match-form hidden">
          <label>Equipe A <select id="matchTeamA" required></select></label>
          <label>Equipe B <select id="matchTeamB" required></select></label>
          <label>Dia <select id="matchDay" required></select></label>
          <label>Horário <input id="matchTime" type="time" required></label>
          <label>Fase
            <select id="matchStage">
              <option value="grupos">Fase de grupos</option>
              <option value="semifinal_1">Semifinal 1</option>
              <option value="semifinal_2">Semifinal 2</option>
              <option value="terceiro_lugar">3º lugar</option>
              <option value="final">Final</option>
            </select>
          </label>
          <button class="primary">Adicionar jogo</button>
        </form>
        <div id="groupMatches" class="fixtures"></div>
      </section>

      <section class="panel">
        <div class="stage-head">
          <div>
            <h2>Fase final</h2>
            <div class="muted">Semifinais, 3º lugar e final</div>
          </div>
        </div>
        <div id="finalMatches" class="fixtures"></div>
        <p id="finalEmpty" class="empty"></p>
      </section>
    </div>

    <div id="standingsSection" class="tab-pane hidden" data-pane="classificacao">
      <section id="podiumSection" class="panel hidden">
        <h2>Pódio</h2>
        <ol id="podiumBody" class="podium"></ol>
      </section>
      <div id="standingsBody" class="group-tables"></div>
      <p class="legend muted">J jogos, V vitórias, SS saldo de sets, SP saldo de pontos, Pts pontos. Os dois primeiros de cada grupo avançam.</p>
    </div>
  </main>
</div>
<div id="toast"></div>
<script src="/static/torneio.js"></script>
</body>
</html>
