<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vôlei MVP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>%F0%9F%8F%90</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <div class="inner">
    <div>
      <h1>🏐 Vôlei</h1>
      <div id="sessionName" class="muted">Nenhuma sessão</div>
      <div id="modeBadge" class="mode-badge hidden"></div>
    </div>
    <div class="actions">
      <button id="togglePlayers">⚙ Jogadores</button>
      <button id="newSession" class="primary" disabled title="Desabilitado temporariamente — evita resetar a sessão do dia sem querer">Nova sessão</button>
    </div>
  </div>
</header>
<dialog id="newSessionDialog">
  <form id="newSessionForm">
    <h2>Nova sessão</h2>
    <p id="newSessionWarning" class="session-warning hidden"></p>
    <label>Nome <input id="newSessionName" required></label>
    <fieldset>
      <legend>Modo</legend>
      <label class="choice"><input type="radio" name="sessionMode" value="normal" checked>
        <span><strong>6×6</strong><br><span class="muted">Dois times sorteados e equilibrados entre os presentes.</span></span></label>
      <label class="choice"><input type="radio" name="sessionMode" value="versus">
        <span><strong>Contra equipe</strong><br><span class="muted">O app sorteia 6 por partida contra equipes fixas, que se alternam.</span></span></label>
    </fieldset>
    <fieldset id="versusTeams" class="hidden">
      <legend>Equipes adversárias</legend>
      <div id="versusTeamList"></div>
      <p class="muted">Na ordem em que aparecem: a primeira partida é contra a primeira marcada, mas dá para trocar na hora.</p>
    </fieldset>
    <p class="muted">Entram na lista todos os jogadores cadastrados; marque a chegada de quem vier.</p>
    <div class="actions">
      <button type="button" id="newSessionCancel">Cancelar</button>
      <button class="primary" id="newSessionCreate">Criar sessão</button>
    </div>
  </form>
</dialog>
<div class="app">
  <main>
    <section id="setup" class="panel">
      <h2>Jogadores cadastrados</h2>
      <form id="playerForm" class="inline">
        <input id="playerName" placeholder="Nome" required>
        <input id="playerScore" type="number" min="0" max="100" value="70" placeholder="Score">
        <select id="playerGender">
          <option value="F">F</option>
          <option value="M">M</option>
          <option value="X">X</option>
        </select>
        <button class="primary">Adicionar</button>
      </form>
      <div id="masterPlayers" class="player-grid"></div>
    </section>

    <section id="sessionPanel" class="panel hidden">
      <div class="section-head">
        <div>
          <h2>Presença</h2>
          <div id="counts" class="muted"></div>
        </div>
        <div class="actions">
          <button id="addOutside">+ Pessoa fora da lista</button>
          <button id="generate" class="primary">Gerar próxima partida</button>
        </div>
      </div>
      <div id="versus" class="versus hidden">
        <div class="versus-options" role="radiogroup" aria-label="Contra qual equipe"></div>
        <label class="versus-missing">Faltam na equipe
          <select id="missing">
            <option value="0">Equipe completa</option>
            <option value="1">1 pessoa</option>
            <option value="2">2 pessoas</option>
            <option value="3">3 pessoas</option>
            <option value="4">4 pessoas</option>
            <option value="5">5 pessoas</option>
          </select>
        </label>
      </div>
      <input id="attendanceSearch" class="search-box" type="search" placeholder="Buscar jogador...">
      <div id="attendance" class="player-grid"></div>
    </section>

    <section id="matchPanel" class="panel hidden">
      <div class="section-head">
        <div>
          <h2 id="matchTitle">Partida</h2>
          <div id="balance" class="muted"></div>
        </div>
        <div class="actions">
          <button id="startMatch" class="primary">▶ Iniciar</button>
          <button id="finishMatch" class="hidden">Encerrar</button>
          <button id="resetMatch">Refazer</button>
        </div>
      </div>
      <div id="teams" class="teams"></div>
      <div id="substitution" class="panel inner hidden"></div>
    </section>
  </main>

  <div id="toast"></div>
</div>
<script src="/static/mascotes/lista.js"></script>
<script src="/static/mascotes.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
