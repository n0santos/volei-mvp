[project]
name = "volei-mvp"
version = "0.1.0"
description = "Gerenciador de sessões de vôlei com seleção justa e times equilibrados."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.services"]
